{% extends "base.html" %}

{% block title %}Statistics{% endblock %}

{% block body %}
<h1>Statistiken</h1>
<h2>Anzahl der Kurse pro Wochentag</h2>
    <form action="{{ url_for('statistics.generate_year_and_month') }}" method="POST" style="display: block;">
        <label for="monthSelect">Monat:</label>
        <select id="monthSelect" name="monthSelect">
          <option value="01">Januar</option>
          <option value="02">Februar</option>
          <option value="03">März</option>
          <option value="04">April</option>
          <option value="05">Mai</option>
          <option value="06">Juni</option>
          <option value="07">Juli</option>
          <option value="08">August</option>
          <option value="09">September</option>
          <option value="10">Oktober</option>
          <option value="11">November</option>
          <option value="12">Dezember</option>
        </select>

        <label for="yearSelect" style="margin-left: 15px;">Jahr:</label>
        <input
          type="number"
          id="yearSelect"
          name="yearSelect"
          min="1970"
          max="2050"
          value="2025"
          step="1"
          style="width: 80px;">
        <button type="submit" style="margin-left: 15px;">Generieren</button>
    </form>
    <img src="{{ url_for('static', filename='plots/appointments_pie.png') }}" alt="Appointments Pie Chart" class="img-fluid mt-1" style="max-width: 600px; max-height: 600px;">

<h2>Teilnehmeranzahl pro Kurs</h2>
    <form action="{{ url_for('statistics.generate_year_only') }}" method="POST" style="display: block;">
        <label for="yearOnly">Jahr:</label>
        <input
        type="number"
        id="yearOnly"
        name="yearOnly"
        min="1970"
        max="2050"
        step="1"
        value="2025">
        <button type="submit" style="margin-left: 15px;">Generieren</button>
    </form>
    <img src="{{ url_for('static', filename='plots/appointments_bars.png') }}" alt="Appointments Pie Chart" class="img-fluid mt-1" style="max-width: 600px; max-height: 600px;">
{% endblock %}>

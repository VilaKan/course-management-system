{% extends "base.html" %}

{% block title %}Nutzer bearbeiten{% endblock %}

{% block body %}
<h2>Nutzer bearbeiten</h2>
<form method="POST">
    <div class="form-group">
        <label for="email">E-Mail:</label>
        <input type="text" class="form-control" name="email" id="email" value="{{ user.email }}" required>
    </div>
    <div class="form-group">
        <label for="password">Passwort:</label>
        <input type="password" class="form-control" name="password" id="password" required>
    </div>
    <br>
    <button type="submit" class="btn btn-primary">Speichern</button>
    <a href="{{ url_for('user_mgmt.home') }}" class="btn btn-secondary">Abbrechen</a>
</form>

{% endblock %}>

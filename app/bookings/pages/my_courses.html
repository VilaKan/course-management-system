{% extends "base.html" %}

{% block title %}Belegung{% endblock %}


{% block body %}
<h1 style="text-align: center;">Meine Kurse</h1>
<table class="table table-hover">
    <thead>
        <tr>
            <th>Kursname</th>
            <th>Termin</th>
            <th>Kursleiter</th>
            <th>Raum</th>
        </tr>
    </thead>
    <tbody>
        {% for kurse in my_courses %}
            <tr onclick="window.location.href='{{ url_for('bookings.my_clicked_courses', appointment_id=kurse.id) }}'" style="cursor:pointer;">
            <td>{{ kurse.Kursname }}</td>
            <td>{{ kurse.Termin }}</td>
            <td>{{ kurse.Kursleiter }}</td>
            <td>{{ kurse.Raum }}</td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

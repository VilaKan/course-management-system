{% extends "base.html" %}
{% block body %}
<div class="container mt-4">
    <h2 class="mb-4">{{ appointment.course.name }}</h2>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Kursbeschreibung</h5>
                    <p class="card-text">{{ appointment.course.description }}</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <p><strong>Termin:</strong> {{ appointment.date.strftime('%d.%m.%Y') }}</p>
                    <p><strong>Kursleiter:</strong> {{ appointment.teacher.username }}</p>
                    <p><strong>Raum:</strong> {{ appointment.room.name }}</p>
                </div>
            </div>
        </div>
    </div>

   <div class="mt-4">
       <form method="post" action="{{ url_for('bookings.booked_course', appointment_id=appointment_id) }}">
           <button type="submit" class="btn btn-primary">📝 Kurs Belegen</button>
       </form>
   </div>


</div>
{% endblock %}

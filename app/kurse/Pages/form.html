{% extends 'layout.html' %}
{% from 'books/pages/_formhelpers.html' import render_field %}

{% block content %}
  <h1>{{ headline }}</h1>

  <form method="post">
    {{ form.csrf_token }}
    {{ render_field(form.kursname) }}
    {{ render_field(form.kursbeschreibung) }}
    <p>
      <a class="btn btn-secondary" href="{{ url_for('kurse_list') }}">Abbrechen</a>
      <button type="submit" class="btn btn-primary">Speichern</button>
    </p>
  </form>
{% endblock %}
